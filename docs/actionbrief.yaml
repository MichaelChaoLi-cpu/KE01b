doc_type: actionbrief
version: 1.0.0
datasetDictionary:
  population_census_2020:
    datasetSourceName: 2020 Population Census T001231 and e-Stat Kumamoto mesh geography
    datasetDescription: Resident population and older-age counts used for mesh demand and disclosure-group equity
      analysis.
    datasetAttribute: other
    datasetProvider: Statistics Bureau of Japan (e-Stat)
    datasetGenerationInfo: Official census tabulation joined to official 125 m mesh geography; suppressed older-age
      values remain represented at disclosure-group support.
    datasetPeriod: 2020 census reference year
    datasetScale: 62,945 populated meshes and 36,657 disclosure groups across Kumamoto Prefecture
    datasetSpatialResolution: Populated 125 m mesh and official disclosure group
    datasetTemporalResolution: Single census reference year
    datasetPreprocessingInfo: Inherited from the KE01 project, standardized to JGD2011, and retained without reallocating
      disclosure-group older-population counts to fine meshes.
  administrative_areas_2025:
    datasetSourceName: MLIT National Land Numerical Information N03 administrative areas
    datasetDescription: Municipality boundaries and names used for map context and municipal reliability aggregation.
    datasetAttribute: geojson
    datasetProvider: Ministry of Land, Infrastructure, Transport and Tourism
    datasetGenerationInfo: Official N03 municipality polygons for Kumamoto Prefecture.
    datasetPeriod: 2025-01-01 reference
    datasetScale: 49 municipality or designated-city ward units
    datasetSpatialResolution: Municipality polygon
    datasetTemporalResolution: Single reference date
    datasetPreprocessingInfo: Standardized to JGD2011, cleaned municipality codes and labels, and dissolved multipart
      records by municipality code.
  road_centerlines_2024:
    datasetSourceName: MLIT National Land Numerical Information N13 road centerlines
    datasetDescription: Standard-road geometry and attributes used to construct the grade-aware routable network.
    datasetAttribute: geojson
    datasetProvider: Ministry of Land, Infrastructure, Transport and Tourism
    datasetGenerationInfo: Official N13 road-centerline features from five first-order mesh packages intersecting
      Kumamoto.
    datasetPeriod: 2024 reference
    datasetScale: 430,201 retained centerline features from five source mesh packages
    datasetSpatialResolution: Road centerline segment
    datasetTemporalResolution: Single reference year
    datasetPreprocessingInfo: Selected Standard Road features, standardized codes and labels, removed exact duplicates,
      noded same-level intersections, and retained cross-boundary links needed for routing.
  emergency_transport_roads_2024:
    datasetSourceName: MLIT National Land Numerical Information N10 emergency transport roads
    datasetDescription: Official emergency-road routes used for map context and compatible route-membership attributes.
    datasetAttribute: geojson
    datasetProvider: Ministry of Land, Infrastructure, Transport and Tourism
    datasetGenerationInfo: Official N10 emergency transport road lines for Kumamoto Prefecture.
    datasetPeriod: 2024 reference
    datasetScale: 264 route features
    datasetSpatialResolution: Emergency transport route line
    datasetTemporalResolution: Single reference year
    datasetPreprocessingInfo: Standardized route codes and classes; matched to compatible routable road categories
      within 30 metres.
  landslide_zones_2025:
    datasetSourceName: MLIT National Land Numerical Information A33 landslide warning zones
    datasetDescription: Warning-zone polygons used only to describe hazard exposure of routable road sections.
    datasetAttribute: geojson
    datasetProvider: Ministry of Land, Infrastructure, Transport and Tourism
    datasetGenerationInfo: Official A33 landslide warning and special-warning polygons for Kumamoto Prefecture.
    datasetPeriod: 2025 reference
    datasetScale: 56,424 warning-zone polygons
    datasetSpatialResolution: Hazard-zone polygon
    datasetTemporalResolution: Single reference year
    datasetPreprocessingInfo: Standardized zone codes and dates; assigned the highest intersected warning class
      to each routable edge and aggregated it to road sections.
  fire_stations_2012:
    datasetSourceName: MLIT National Land Numerical Information P17 fire stations
    datasetDescription: Fire stations, branches, and outposts used as candidate ambulance dispatch bases.
    datasetAttribute: shapefile
    datasetProvider: Ministry of Land, Infrastructure, Transport and Tourism
    datasetGenerationInfo: Official P17 fire-facility points for Kumamoto Prefecture.
    datasetPeriod: 2012 reference
    datasetScale: 94 fire facilities, including 81 candidate dispatch-base records
    datasetSpatialResolution: Fire-facility point
    datasetTemporalResolution: Single reference year
    datasetPreprocessingInfo: Standardized facility types and municipality codes, selected stations and branches
      or outposts, and snapped candidates to eligible road edges within 150 metres.
  medical_facilities_2020:
    datasetSourceName: MLIT National Land Numerical Information P04 medical facilities
    datasetDescription: Hospital points and emergency or disaster-base designations used to define the fixed eligible
      hospital set.
    datasetAttribute: geojson
    datasetProvider: Ministry of Land, Infrastructure, Transport and Tourism
    datasetGenerationInfo: Official P04 medical-facility points and designations for Kumamoto Prefecture.
    datasetPeriod: 2020 reference
    datasetScale: 2,561 medical facilities; 75 eligible hospitals retained in the network model
    datasetSpatialResolution: Medical-facility point
    datasetTemporalResolution: Single reference year
    datasetPreprocessingInfo: Standardized facility and designation codes, selected hospitals with emergency or
      core/regional disaster-base designation, and snapped them to eligible roads within 150 metres.
  mhlw_hospital_names_2026:
    datasetSourceName: MHLW hospital facility open data
    datasetDescription: Current hospital-name roster used only to provide unique English or Romanized labels for
      final hospital outputs.
    datasetAttribute: table
    datasetProvider: Ministry of Health, Labour and Welfare
    datasetGenerationInfo: National hospital facility open-data extract filtered to Kumamoto hospitals.
    datasetPeriod: 2026-06-01 extract
    datasetScale: 198 Kumamoto hospital records
    datasetSpatialResolution: Hospital record
    datasetTemporalResolution: Single extract date
    datasetPreprocessingInfo: Filtered to Kumamoto, standardized identifiers and text, and linked deterministically
      to the 75 network hospitals with reviewed English-name overrides where needed.
  derived_network_access:
    datasetSourceName: Kumamoto routable network, road sections, and emergency-access connectors
    datasetDescription: Analysis-ready graph, junction-to-junction road sections, and demand, dispatch-base, and
      hospital connector layers.
    datasetAttribute: other
    datasetProvider: Generated by this study
    datasetGenerationInfo: Derived from the retained road centerlines and actual study inputs using grade-aware
      noding, one-metre endpoint snapping, junction-chain assembly, assumed speeds, and nearest-edge connectors.
    datasetPeriod: Cross-sectional simulation baseline
    datasetScale: 390,234 edges; 314,391 nodes; 343,844 road sections; 62,945 mesh, 36,657 disclosure-group, 81
      dispatch-base, and 75 hospital connector records
    datasetSpatialResolution: Road edge, road node, road section, or virtual network connector
    datasetTemporalResolution: Static baseline
    datasetPreprocessingInfo: Built the full eligible graph, preserved disconnected components, calculated edge
      and section impedance, attached route and hazard descriptors, and recorded rejected connectors explicitly.
  severity_calibration_results:
    datasetSourceName: Length-weighted road-failure severity calibration
    datasetDescription: Calibration results used to select main and stress expected-failed-length scenarios.
    datasetAttribute: table
    datasetProvider: Generated by this study
    datasetGenerationInfo: One hundred paired full-network Monte Carlo replicates at 0.5%, 1%, 2%, 3%, 5%, and 10%
      expected failed road length.
    datasetPeriod: Simulation experiment
    datasetScale: 600 severity-replicate observations
    datasetSpatialResolution: Prefecture-wide road network per replicate and severity
    datasetTemporalResolution: 100 replicates at six severity levels
    datasetPreprocessingInfo: Calibrated length-dependent section probabilities, reused paired section scores across
      severities, fully rerouted both emergency stages, and summarized mean and P5-P95 responses.
  formal_monte_carlo_results:
    datasetSourceName: Formal length-weighted emergency-access Monte Carlo results
    datasetDescription: Primary grid, population, municipality, hospital, nested-failure, and convergence results.
    datasetAttribute: table
    datasetProvider: Generated by this study
    datasetGenerationInfo: One thousand paired full-network replicates at 1%, 3%, 5%, and 10% expected failed road
      length.
    datasetPeriod: Simulation experiment
    datasetScale: 4,000 scenario-replicate metrics; 251,780 grid-scenario rows; 146,628 older-population rows; 300
      hospital-scenario rows; 180,000 municipality-replicate rows
    datasetSpatialResolution: Grid, disclosure group, municipality, hospital, road section, and prefecture-wide
      replicate
    datasetTemporalResolution: 1,000 replicates at four severity levels
    datasetPreprocessingInfo: Applied nested length-dependent failures, fully rerouted dispatch and hospital stages,
      retained unreachable outcomes, and computed reliability, uncertainty, catchment, and convergence summaries.
  speed_sensitivity_results:
    datasetSourceName: Emergency-access travel-speed sensitivity results
    datasetDescription: Sensitivity results for uniform 0.8, 1.0, and 1.2 multipliers on assumed road speeds.
    datasetAttribute: table
    datasetProvider: Generated by this study
    datasetGenerationInfo: Repeated the formal paired failure states under three uniform speed multipliers and three
      timely-access thresholds.
    datasetPeriod: Simulation sensitivity experiment
    datasetScale: 36,000 replicate-severity-speed-threshold observations
    datasetSpatialResolution: Prefecture-wide replicate, severity, speed multiplier, and threshold
    datasetTemporalResolution: 1,000 replicates for each declared specification
    datasetPreprocessingInfo: Reused the formal failure draws, rescaled network impedance uniformly, rerouted the
      full emergency chain, and summarized timely coverage and loss.
  road_section_consequence_results:
    datasetSourceName: Road-section accessibility consequence and expected-risk results
    datasetDescription: Network-wide leave-one-section-out accessibility losses and probability-weighted expected
      risks.
    datasetAttribute: table
    datasetProvider: Generated by this study
    datasetGenerationInfo: Removed each eligible road section from the otherwise available baseline graph and recomputed
      population coverage at 15, 30, and 45 minutes.
    datasetPeriod: Cross-sectional network intervention screen
    datasetScale: 343,844 eligible road-section records
    datasetSpatialResolution: Junction-to-junction road section
    datasetTemporalResolution: Static baseline consequence with 1%, 3%, and 5% scenario weights
    datasetPreprocessingInfo: Computed nonnegative single-section potential loss, multiplied 30-minute loss by calibrated
      section failure probabilities, retained zeros, audited the positive upper tail, and independently recomputed
      48 sections.
