figureDictionary:
  fig_emergency_care_network_and_population_demand:
    figureId: fig_emergency_care_network_and_population_demand
    figurePath: data/results/figures/Figure_emergency_care_network_and_population_demand.png
    figureCaption: Population demand and emergency-care network across Kumamoto
    figurePanelCount: 3
    figureNote: >-
      Panel a maps total population by 125 m mesh on a logarithmic scale. Panel b maps the population age 65 and
      older at disclosure-group support on a logarithmic scale. Panel c shows the standard road network, primary
      and secondary emergency roads, candidate dispatch bases, and eligible emergency hospitals.
    figureAim: Describe the spatial support of demand, dispatch bases, eligible hospitals, and emergency roads.
    figureExplanation: Maps total population at 125 m resolution, older population at disclosure-group support,
      and the road, dispatch-base, hospital, and emergency-route network used by the study.
    figureSuitableSection: Data and study setting
  fig_baseline_two_stage_emergency_travel_time:
    figureId: fig_baseline_two_stage_emergency_travel_time
    figurePath: data/results/figures/Figure_baseline_two_stage_emergency_travel_time.png
    figureCaption: Baseline dispatch, hospital transport, and total emergency travel times
    figurePanelCount: 3
    figureNote: >-
      Panel a maps travel time from the nearest candidate dispatch base to each population mesh. Panel b maps travel
      time from each mesh to the nearest eligible emergency hospital. Panel c maps total two-stage travel time, the
      sum of dispatch and hospital-transport time. Grey meshes are not estimated; all times are in minutes.
    figureAim: Establish baseline travel impedance for both stages of emergency access.
    figureExplanation: Shows that baseline access is the sum of nearest-dispatch and nearest-eligible-hospital travel
      times, while grey units remain explicitly not estimated.
    figureSuitableSection: Baseline accessibility results
  fig_failure_severity_response:
    figureId: fig_failure_severity_response
    figurePath: data/results/figures/Figure_failure_severity_response.png
    figureCaption: Emergency-access response to increasing failed road length
    figurePanelCount: 3
    figureNote: >-
      Panel a reports the population retaining baseline 30-minute access. Panel b reports the population losing
      baseline 30-minute access, and panel c reports the newly disconnected population. Lines show means and shaded
      bands show P5-P95 across 100 calibration replicates; open circles, filled circles, and diamonds denote
      calibration, main, and stress severities, respectively.
    figureAim: Calibrate interpretable main and stress failure severities.
    figureExplanation: The calibration shows monotone decline in 30-minute coverage and increasing access loss and
      disconnection as expected failed road length rises; shaded bands are P5-P95 across 100 replicates.
    figureSuitableSection: Failure calibration results
  fig_nested_length_dependent_road_failure_realizations:
    figureId: fig_nested_length_dependent_road_failure_realizations
    figurePath: data/results/figures/Figure_nested_length_dependent_road_failure_realizations.png
    figureCaption: Nested road-failure realizations across main and stress severities
    figurePanelCount: 4
    figureNote: >-
      Panels a-d show one paired nested realization at expected failed-road-length levels of 1%, 3%, 5%, and 10%,
      respectively. Red sections have failed, green sections remain available, and dark-green lines identify
      available major roads. Each annotation reports the number of failed sections and the realized failed-length
      share.
    figureAim: Demonstrate paired, length-dependent, nested failure assignment.
    figureExplanation: One paired replicate visualizes how failed sections expand from 1% through 10%, with realized
      failed length close to each calibrated expectation.
    figureSuitableSection: Simulation design and realization checks
  fig_grid_emergency_access_loss_probability:
    figureId: fig_grid_emergency_access_loss_probability
    figurePath: data/results/figures/Figure_grid_emergency_access_loss_probability.png
    figureCaption: Grid probability of losing baseline 30-minute emergency access
    figurePanelCount: 3
    figureNote: >-
      Panels a-c map the probability that a represented population grid loses baseline 30-minute emergency access
      under expected failed-road-length levels of 1%, 3%, and 5%, respectively. Color is shown on a logarithmic
      probability scale; zero-probability grids and grids without represented population are retained as separate
      classes. Insets report affected-grid counts and expected population loss.
    figureAim: Locate population grids with fragile timely emergency access.
    figureExplanation: Maps the expanding spatial footprint and probability of losing baseline 30-minute access
      under the 1%, 3%, and 5% main scenarios, retaining zero-probability grids explicitly.
    figureSuitableSection: Grid reliability results
  fig_population_coverage_under_length_dependent_road_failure:
    figureId: fig_population_coverage_under_length_dependent_road_failure
    figurePath: data/results/figures/Figure_population_coverage_under_length_dependent_road_failure.png
    figureCaption: Population coverage retained across failure severity and thresholds
    figurePanelCount: 3
    figureNote: >-
      Panels a-c report the percentage of baseline-covered population retaining access within 15, 30, and 45
      minutes, respectively, as expected failed road length increases. Blue and orange series represent total and
      age-65-plus populations; shaded bands show P5-P95, diamonds mark the 10% stress scenario, and the dashed line
      marks baseline coverage.
    figureAim: Compare total and older-population reliability across thresholds and severities.
    figureExplanation: Total and age-65-plus population coverage decline at all thresholds as severity increases;
      older-population coverage is consistently slightly less reliable on its valid disclosure-group support.
    figureSuitableSection: Population reliability results
  fig_hospital_service_reliability_under_road_failure:
    figureId: fig_hospital_service_reliability_under_road_failure
    figurePath: data/results/figures/Figure_hospital_service_reliability_under_road_failure.png
    figureCaption: Hospital catchment reliability under increasing road failure
    figurePanelCount: 3
    figureNote: >-
      Panels a-c map hospital catchment reliability at expected failed-road-length levels of 1%, 3%, and 5%,
      respectively. Color shows mean catchment change from baseline on a signed-log scale, symbol size shows mean
      catchment population, outline width shows zero-catchment frequency, and symbol shape distinguishes
      disaster-base hospitals from other eligible emergency hospitals.
    figureAim: Show road-supported changes in potential hospital service populations.
    figureExplanation: Hospital catchment sizes, changes from baseline, and zero-catchment frequencies become more
      variable as failed road length increases, conditional on the fixed unweighted hospital set.
    figureSuitableSection: Hospital reliability results
  fig_road_section_accessibility_consequence_and_expected_risk:
    figureId: fig_road_section_accessibility_consequence_and_expected_risk
    figurePath: data/results/figures/Figure_road_section_accessibility_consequence_and_expected_risk.png
    figureCaption: Road-section accessibility consequence and expected risk surfaces
    figurePanelCount: 6
    figureNote: >-
      Panels a-c map potential population loss after single-section removal for 15-, 30-, and 45-minute timely-access
      thresholds, respectively. Panels d-f map 30-minute expected risk, defined as failure probability multiplied by
      potential population loss, at expected failed-road-length levels of 1%, 3%, and 5%, respectively. The logarithmic
      potential-loss colorbar is placed below panels a-c, and the logarithmic expected-risk colorbar is placed below
      panels d-f; zero-value sections remain outlined.
    figureAim: Map every road section by potential access consequence and scenario risk.
    figureExplanation: Maps nonzero leave-one-section-out population consequences for three thresholds and 30-minute
      probability-weighted expected risk for all eligible sections at the three main severities.
    figureSuitableSection: Road consequence and risk results
  fig_monte_carlo_convergence_and_stress_sensitivity:
    figureId: fig_monte_carlo_convergence_and_stress_sensitivity
    figurePath: data/results/figures/Figure_monte_carlo_convergence_and_stress_sensitivity.png
    figureCaption: Monte Carlo convergence, stress severity, and speed sensitivity
    figurePanelCount: 4
    figureNote: >-
      Panel a shows running mean 30-minute coverage with running P5-P95 intervals at simulation checkpoints. Panel b
      shows the corresponding Monte Carlo standard errors and the 5-percentage-point stability classification.
      Panel c compares population losing baseline 30-minute access and newly disconnected population across failure
      severities. Panel d shows 30-minute coverage under uniform assumed-speed multipliers of 0.8, 1.0, and 1.2.
    figureAim: Assess simulation precision and declared stress and speed sensitivities.
    figureExplanation: Running estimates stabilize, Monte Carlo standard errors fall, all severities pass the declared
      convergence rule after the reference checkpoint, and stress and speed sensitivities preserve the expected
      ordering.
    figureSuitableSection: Robustness and convergence results
analysisStructureBrief:
  overview: An applied paired Monte Carlo network-reliability study linking length-dependent road-section failures
    to two-stage ambulance access, population and hospital reliability, and network-wide road-section consequence
    across Kumamoto Prefecture.
  levels:
  - levelName: Baseline network and study-population validation
    levelAim: Verify that the full fire-station-to-grid-to-hospital chain is represented on an interpretable road
      network.
    inputs:
    - Road Section Identifier
    - Road Section Length (m)
    - Road Edge Count
    - From Node Identifier
    - To Node Identifier
    - Network Component Identifier
    - Network Snap Distance (m)
    - Candidate Dispatch Base
    - Eligible Emergency Hospital
    - Total Population
    modelOrMethod: Construct the eligible baseline graph G0=(V,E), assign edge time t_e=60L_e/(1000v_e), retain
      all connected components, and add accepted demand, dispatch-base, and hospital connectors with their snap-distance
      travel time.
    outputs:
    - Emergency Care Network and Population Demand
    - Baseline Two-Stage Emergency Travel Time
    - Network and Simulation Descriptive Summary
    interpretation: The observed topology, impedance, facilities, demand supports, and connector audits determine
      whether the modeled emergency chain is usable; results remain conditional on represented roads and connector
      thresholds.
  - levelName: Length-dependent failure calibration
    levelAim: Calibrate comparable road-section failure states to target expected failed road length.
    inputs:
    - Expected Failed Road Length Share
    - Failure Intensity per Metre
    - Road Section Length (m)
    - Section Failure Probability
    - Realized Failed Road Length Share
    - Simulation Replicate
    modelOrMethod: For section s, q_s(lambda_d)=1-exp(-lambda_d L_s), with lambda_d solving sum_s L_s q_s(lambda_d)/sum_s
      L_s=d; one paired uniform score per section and replicate creates nested severity states.
    outputs:
    - Failure Severity Response
    - Network and Simulation Descriptive Summary
    interpretation: Section length and the calibrated intensity determine failure probability; the response identifies
      transparent planning severities rather than observed earthquake or engineering failure probabilities.
  - levelName: Formal nested road-failure experiment
    levelAim: Generate reproducible paired road-availability states for the main and stress severities.
    inputs:
    - Road Section Identifier
    - Section Failure Probability
    - Road Failure Indicator
    - Road Available
    - Simulation Replicate
    - Random Failure Model
    modelOrMethod: Set Z_srd=1{U_sr<q_s(lambda_d)} and remove every internal edge and attached connector belonging
      to failed section s before full rerouting; reuse U_sr across severities within each replicate.
    outputs:
    - Nested Length-Dependent Road Failure Realizations
    interpretation: The shared random score makes 1%, 3%, 5%, and 10% states directly comparable and nested, but
      the mechanism remains a scenario model rather than event reconstruction.
  - levelName: Grid emergency-access reliability
    levelAim: Estimate each grid's probability of completing the two-stage emergency chain within declared thresholds.
    inputs:
    - Analysis Unit Identifier
    - Dispatch Travel Time
    - Hospital Transport Time
    - Total Emergency Access Time
    - Timely Access Threshold (min)
    - Timely Access Status
    - Timely Access Probability
    - Grid Access Loss Probability
    - P90 Emergency Access Time
    modelOrMethod: Fully reroute D_ird=min_f d_rd(f,i) and H_ird=min_h d_rd(i,h), set T_ird=D_ird+H_ird and A_ird(tau)=1{T_ird<=tau},
      then estimate pi_hat_id(tau)=R^-1 sum_r A_ird(tau) and baseline-loss probability over all R replicates.
    outputs:
    - Grid Emergency Access Loss Probability
    - Emergency Access Reliability by Severity and Threshold
    interpretation: Road availability determines feasible dispatch and hospital paths and therefore grid reliability;
      unreachable outcomes remain explicit, and results are conditional on fixed facilities and assumed speeds.
  - levelName: Population and municipal reliability
    levelAim: Aggregate grid reliability into total, older-population, and municipal loss distributions.
    inputs:
    - Total Population
    - Population Age 65+
    - Municipality Name
    - Timely Access Status
    - Population Losing Timely Access
    - Older Population Losing Timely Access
    - Population Newly Disconnected
    modelOrMethod: For weight w_i, compute C_rd(tau)=sum_i w_i A_ird(tau) and L_rd(tau)=sum_i w_i 1{A_i0(tau)=1
      and A_ird(tau)=0}; summarize all 1,000 replicates and retain age-65-plus counts at disclosure-group support.
    outputs:
    - Population Coverage under Length-Dependent Road Failure
    - Municipal Emergency Access Reliability
    interpretation: Population weights convert grid states into coverage and loss; municipality estimates are descriptive
      reliability levels with uncertainty, not ordinal rankings, and older-population precision is limited to disclosure
      groups.
  - levelName: Hospital service reliability
    levelAim: Estimate road-supported hospital assignment and catchment stability under road failure.
    inputs:
    - Hospital Name Romanized
    - Assigned Hospital
    - Hospital Catchment Population
    - Hospital Assignment Probability
    - Hospital Demand Change
    - Operational Hospital Set
    modelOrMethod: Assign each reachable demand unit to the hospital minimizing transport time and compute K_hrd=sum_i
      w_i 1{h_ird=h}; summarize catchment distributions, assignment frequency, baseline change, and zero-catchment
      frequency.
    outputs:
    - Hospital Service Reliability under Road Failure
    - Hospital Service Reliability
    interpretation: Network reachability and substitution determine potential catchments within one fixed unweighted
      eligible-hospital set; estimates do not represent clinical capacity or observed destination choice.
  - levelName: Road-section consequence and expected risk
    levelAim: Map every eligible road section by single-section accessibility consequence and scenario-weighted
      expected risk.
    inputs:
    - Road Section Identifier
    - Geometry
    - Timely Access Threshold (min)
    - Section Failure Probability
    - Road-Section Potential Access Loss
    - Road-Section Expected Risk
    - Route Name
    modelOrMethod: For each section s, compute P_s(tau)=C_0(tau)-C_-s(tau) after removing only s, then R_sd(tau)=q_s(lambda_d)P_s(tau);
      retain zero and positive values for all 343,844 sections.
    outputs:
    - Road-Section Accessibility Consequence and Expected Risk
    - Road-Section Loss by Network Characteristics
    interpretation: Topology and population coverage determine potential loss, while the declared failure model
      supplies the risk weight; interactions among simultaneous failures, repair costs, and engineering priority
      are not identified.
  - levelName: Uncertainty, convergence, and sensitivity
    levelAim: Test whether primary results stabilize with replicate count and remain interpretable under stress
      and speed alternatives.
    inputs:
    - Simulation Replicate
    - Monte Carlo Convergence Status
    - Expected Failed Road Length Share
    - Assumed Speed (km/h)
    - Operational Hospital Set
    modelOrMethod: At R_j in {100,250,500,750,1000}, compare population mean change, the grid-probability P95 change,
      and hospital-catchment P95 change with tolerances 0.005, 0.05, and 0.005; also evaluate 10% stress and 0.8x/1.2x
      speed specifications.
    outputs:
    - Monte Carlo Convergence and Stress Sensitivity
    - Monte Carlo Convergence Summary
    interpretation: Stable checkpoint changes support numerical precision under the declared model; sensitivity
      results reveal dependence on severity and speed but cannot validate unavailable engineering or operational
      inputs.
