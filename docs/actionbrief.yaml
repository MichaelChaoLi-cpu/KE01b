    tableId: table_network_and_simulation_descriptive_summary
    tablePath: data/results/tables/Table_network_and_simulation_descriptive_summary.xlsx
    tableCaption: Network, demand, facility, connector, and simulation summary
    tableAim: Document the represented analytical system and executed experiment.
    tableExplanation: Reports the realized analysis scale and distributions for 343,844 road sections, graph elements,
      demand supports, accepted connectors, failure calibration, and executed simulation specifications.
    tableSuitableSection: Data and study setting
  table_emergency_access_reliability_by_severity_and_threshold:
    tableId: table_emergency_access_reliability_by_severity_and_threshold
    tablePath: data/results/tables/Table_emergency_access_reliability_by_severity_and_threshold.xlsx
    tableCaption: Emergency-access reliability by severity and timely threshold
    tableAim: Quantify population reliability across four severities and three time thresholds.
    tableExplanation: Compares 1,000-replicate population coverage, Monte Carlo precision, uncertainty quantiles,
      loss, older-person loss, and new disconnection for every main or stress severity and threshold.
    tableSuitableSection: Population reliability results
  table_municipal_emergency_access_reliability:
    tableId: table_municipal_emergency_access_reliability
    tablePath: data/results/tables/Table_municipal_emergency_access_reliability.xlsx
    tableCaption: Municipal emergency-access reliability levels and uncertainty
    tableAim: Describe geographic heterogeneity without asserting ordinal rank stability.
    tableExplanation: Reports municipality-specific population, older population, access probability, P90 time,
      coverage loss, uncertainty, and disconnection without interpreting display order as a formal rank.
    tableSuitableSection: "Appendix A: Municipal Emergency-Access Reliability"
  table_hospital_service_reliability:
    tableId: table_hospital_service_reliability
    tablePath: data/results/tables/Table_hospital_service_reliability.xlsx
    tableCaption: Hospital assignment and catchment reliability under road failure
    tableAim: Quantify potential service-population stability for the fixed eligible-hospital set.
    tableExplanation: Reports all 75 eligible hospitals across four severities, including fixed role, baseline and
      simulated catchments, assignment probability, demand change, uncertainty quantiles, and zero-catchment frequency.
    tableSuitableSection: "Appendix A: Hospital Service Reliability"
  table_road_section_loss_by_network_characteristics:
    tableId: table_road_section_loss_by_network_characteristics
    tablePath: data/results/tables/Table_road_section_loss_by_network_characteristics.xlsx
    tableCaption: Road-section loss and risk by network characteristics
    tableAim: Summarize continuous all-section consequences without a Top-20 cutoff.
    tableExplanation: Summarizes zero-loss prevalence and the full potential-loss and expected-risk distributions
      by road category, emergency-route membership, hazard exposure, and failure severity without a Top-20 cutoff.
    tableSuitableSection: Road consequence and risk results
  table_monte_carlo_convergence_summary:
    tableId: table_monte_carlo_convergence_summary
